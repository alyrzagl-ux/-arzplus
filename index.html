<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArzPlus</title>

    <style>
        body {
            margin: 0;
            font-family: Tahoma, Arial;
            background: #f4f5f7;
        }

        header {
            background: #111827;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .container {
            max-width: 600px;
            margin: 20px auto;
            padding: 15px;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 15px #ddd;
        }

        .price {
            font-size: 24px;
            font-weight: bold;
            margin: 10px;
        }

        #status {
            text-align: center;
            margin: 20px;
        }
    </style>
</head>

<body>

<header>
    <h1>ArzPlus</h1>
    <p>نرخ لحظه‌ای ارز</p>
</header>

<div class="container">

    <div class="card">
        <h2>🇺🇸 دلار</h2>
        <div class="price" id="usd">---</div>
        تومان
    </div>

    <div class="card">
        <h2>🇪🇺 یورو</h2>
        <div class="price" id="eur">---</div>
        تومان
    </div>

    <div class="card">
        <h2>🇹🇷 لیر</h2>
        <div class="price" id="try">---</div>
        تومان
    </div>

    <div id="status">
        در حال دریافت نرخ...
    </div>

</div>

<script>

    // =================================================
     fx-ntz-v1-0w2CjsU5Tz00c5zyGoackFotJAPzJ9K4IqyttVny
    // =================================================

    const API_KEY = "fx-ntz-v1-0w2Cjs…tVny";


    const API_URL =
        "https://netarz.ir/api/fx/v1";


    async function getRate(currency) {

        const response = await fetch(
            API_URL + "/rates/" + currency,
            {
                headers: {
                    "Authorization":
                        "Bearer " + API_KEY,

                    "Accept":
                        "application/json"
                }
            }
        );

        if (!response.ok) {
            throw new Error(
                "HTTP " + response.status
            );
        }

        const result =
            await response.json();

        return result.data;
    }


    async function loadRates() {

        const status =
            document.getElementById("status");

        try {

            const usd =
                await getRate("USD");

            const eur =
                await getRate("EUR");

            const tr =
                await getRate("TRY");


            document.getElementById("usd")
                .textContent =
                Number(usd.sell)
                    .toLocaleString("fa-IR");


            document.getElementById("eur")
                .textContent =
                Number(eur.sell)
                    .toLocaleString("fa-IR");


            document.getElementById("try")
                .textContent =
                Number(tr.sell)
                    .toLocaleString("fa-IR");


            status.textContent =
                "آخرین بروزرسانی: " +
                new Date()
                    .toLocaleTimeString("fa-IR");

        }

        catch (error) {

            console.error(error);

            status.textContent =
                "خطا در دریافت نرخ";

        }
    }


    loadRates();

</script>

</body>
</html>
