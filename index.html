<script>

/fx-ntz-v1-13a07f…sMsI */
const API_KEY=" fx-ntz-v1-13a07foNuYZza6TowTKl060SOxqdoV3pLELKsMsI";

const API="https://netarz.ir/api/fx/v1/rates?codes=USD,EUR,TRY";

async function load(){

try{

const r=await fetch(API,{
headers:{
"Authorization":"Bearer "+API_KEY,
"Accept":"application/json"
}
});

const j=await r.json();

if(!r.ok) throw new Error(
j.error?.code+" - "+j.error?.message
);

const data=j.data||[];

const usd=data.find(x=>x.code==="USD");
const eur=data.find(x=>x.code==="EUR");
const tr=data.find(x=>x.code==="TRY");

if(usd){
document.getElementById("usdBuy").textContent=Number(usd.buy).toLocaleString("fa-IR");
document.getElementById("usdSell").textContent=Number(usd.sell).toLocaleString("fa-IR");
}

if(eur){
document.getElementById("eurBuy").textContent=Number(eur.buy).toLocaleString("fa-IR");
document.getElementById("eurSell").textContent=Number(eur.sell).toLocaleString("fa-IR");
}

if(tr){
document.getElementById("tryBuy").textContent=Number(tr.buy).toLocaleString("fa-IR");
document.getElementById("trySell").textContent=Number(tr.sell).toLocaleString("fa-IR");
}

document.getElementById("status").textContent=
"آخرین بروزرسانی: "+
new Date().toLocaleTimeString("fa-IR");

}catch(e){

console.error(e);

document.getElementById("status").textContent=
"خطا: "+e.message;

document.getElementById("status").className="error";
