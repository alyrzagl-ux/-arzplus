<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArzPlus | نرخ ارز</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Tahoma, sans-serif;
            background: #f4f5f7;
            color: #222;
        }

        header {
            background: #111827;
            color: white;
            text-align: center;
            padding: 28px 15px;
        }

        header h1 {
            margin: 0 0 8px;
            font-size: 30px;
        }

        header p {
            margin: 0;
            opacity: 0.8;
        }

        .container {
            max-width: 600px;
            margin: 25px auto;
            padding: 0 15px;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.06);
        }

        .title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .prices {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .price-box {
            flex: 1;
            background: #f8f9fa;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
        }

        .price-box small {
            display: block;
            color: #777;
            margin-bottom: 8px;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
        }

        .unit {
            font-size: 12px;
            color: #777;
        }

        .status {
            text-align: center;
            color: #777;
            font-size: 13px;
            margin-top: 20px;
        }

        .error {
            color: #c62828;
        }
    </style>
</head>

<body>

<header>
    <h1>ArzPlus</h1>
    <p>نرخ لحظه‌ای ارز</p>
</header>

<div class="container">

    <div class="card">
        <div class="title">🇺🇸 دلار آمریکا</div>

        <div class="prices">
            <div class="price-box">
                <small>خرید</small>
                <div class="price" id="usd-buy">---</div>
                <span class="unit">تومان</span>
            </div>

            <div class="price-box">
                <small>فروش</small>
                <div class="price" id="usd-sell">---</div>
                <span class="unit">تومان</span>
            </div>
        </div>
    </div>


    <div class="card">
        <div class="title">🇪🇺 یورو</div>

        <div class="prices">
            <div class="price-box">
                <small>خرید</small>
                <div class="price" id="eur-buy">---</div>
                <span class="unit">تومان</span>
            </div>

            <div class="price-box">
                <small>فروش</small>
                <div class="price" id="eur-sell">---</div>
                <span class="unit">تومان</span>
            </div>
        </div>
    </div>


    <div class="card">
        <div class="title">🇹🇷 لیر ترکیه</div>

        <div class="prices">
            <div class="price-box">
                <small>خرید</small>
                <div class="price" id="try-buy">---</div>
                <span class="unit">تومان</span>
            </div>

            <div class="price-box">
                <small>فروش</small>
                <div class="price" id="try-sell">---</div>
                <span class="unit">تومان</span>
            </div>
        </div>
    </div>


    <div class="status" id="status">
        در حال دریافت نرخ‌ها...
    </div>

</div>


<script>

    // =====================================================
    // API KEY
    // =====================================================

    const API_KEY = "fx-ntz-v1-q2umHq3GIAcL4TXEanmeb68IkGrcr15xe6IAILfj";


    // =====================================================
    // API URL
    // =====================================================

    const API_URL = "https://netarz.ir/api/fx/v1";


    function formatPrice(number) {

        if (
            number === null ||
            number === undefined ||
            number === ""
        ) {
            return "---";
        }

        return Number(number).toLocaleString("fa-IR");
    }


    async function getRate(code) {

        const response = await fetch(
            `${API_URL}/rates/${code}`,
            {
                method: "GET",

                headers: {
                    "Authorization": `Bearer ${API_KEY}`,
                    "Accept": "application/json"
                }
            }
        );


        const result = await response.json();


        if (!response.ok) {

            throw new Error(
                result.error?.message ||
                "خطا در دریافت نرخ"
            );

        }


        return result.data;
    }


    async function loadRates() {

        const status =
            document.getElementById("status");


        try {

            status.textContent =
                "در حال دریافت نرخ‌ها...";

            status.classList.remove("error");


            const [usd, eur, tr] =
                await Promise.all([

                    getRate("USD"),

                    getRate("EUR"),

                    getRate("TRY")

                ]);


            document.getElementById("usd-buy")
                .textContent =
                formatPrice(usd.buy);

            document.getElementById("usd-sell")
                .textContent =
                formatPrice(usd.sell);


            document.getElementById("eur-buy")
                .textContent =
                formatPrice(eur.buy);

            document.getElementById("eur-sell")
                .textContent =
                formatPrice(eur.sell);


            document.getElementById("try-buy")
                .textContent =
                formatPrice(tr.buy);

            document.getElementById("try-sell")
                .textContent =
                formatPrice(tr.sell);


            status.textContent =
                "آخرین بروزرسانی: " +
                new Date().toLocaleTimeString("fa-IR");


        } catch (error) {

            console.error("API Error:", error);

            status.textContent =
                "خطا در دریافت نرخ‌ها. " +
                "کلید API و تنظیمات دامنه را بررسی کنید.";

            status.classList.add("error");
        }

    }


    // اجرای اولیه
    loadRates();


    // بروزرسانی خودکار هر 5 دقیقه
    setInterval(
        loadRates,
        5 * 60 * 1000
    );

</script>

</body>
</html>
