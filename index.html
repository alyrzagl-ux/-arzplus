<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ارز پلاس | نیک فرجام</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 15%, rgba(212, 175, 55, 0.12), transparent 30%),
        #050505;
      color: #f5f5f5;
      font-family: "Vazirmatn", sans-serif;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: auto;
      padding: 30px 18px 45px;
    }

    /* HEADER */

    .brand {
      text-align: center;
      margin-bottom: 30px;
    }

    .brand-name {
      font-family: "Noto Naskh Arabic", serif;
      font-size: 58px;
      font-weight: 700;
      line-height: 1.2;

      background: linear-gradient(
        135deg,
        #fff2a6,
        #d4af37,
        #fff1a3,
        #b8860b
      );

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;

      text-shadow: 0 0 25px rgba(212,175,55,0.18);
    }

    .brand-en {
      margin-top: 2px;
      color: #d4af37;
      font-size: 14px;
      letter-spacing: 5px;
      font-weight: 700;
    }

    .brand-line {
      width: 110px;
      height: 1px;
      margin: 15px auto 0;

      background: linear-gradient(
        90deg,
        transparent,
        #d4af37,
        transparent
      );
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      font-size: 13px;
      margin-top: 14px;
    }

    /* RATE CARDS */

    .rates {
      display: grid;
      gap: 14px;
      margin-top: 30px;
    }

    .rate-card {
      position: relative;
      overflow: hidden;

      background: linear-gradient(
        145deg,
        #111,
        #080808
      );

      border: 1px solid rgba(212,175,55,0.45);
      border-radius: 18px;

      padding: 20px 22px;

      box-shadow:
        0 10px 35px rgba(0,0,0,0.45),
        inset 0 0 25px rgba(212,175,55,0.025);
    }

    .rate-card::before {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      width: 4px;
      height: 100%;

      background: linear-gradient(
        #fff0a0,
        #d4af37,
        #8f6b16
      );
    }

    .currency {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .currency-name {
      font-size: 16px;
      font-weight: 600;
      color: #eee;
    }

    .currency-symbol {
      color: #d4af37;
      font-size: 13px;
      margin-right: 5px;
    }

    .price {
      margin-top: 9px;
      color: #e4c45c;
      font-size: 27px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .unit {
      color: #777;
      font-size: 11px;
      margin-right: 5px;
    }

    /* UPDATE */

    .update {
      text-align: center;
      margin-top: 20px;
      color: #777;
      font-size: 11px;
    }

    /* ERROR */

    .error {
      display: none;
      text-align: center;
      margin-top: 15px;
      color: #d88;
      font-size: 12px;
    }

    /* FOOTER */

    .footer {
      text-align: center;
      margin-top: 40px;
      padding-top: 20px;

      border-top: 1px solid rgba(212,175,55,0.15);
    }

    .footer-title {
      color: #d4af37;
      font-size: 14px;
      font-weight: 700;
    }

    .footer-text {
      color: #666;
      font-size: 11px;
      margin-top: 7px;
    }

    .telegram {
      display: inline-block;
      margin-top: 15px;

      color: #d4af37;
      text-decoration: none;

      border: 1px solid rgba(212,175,55,0.35);
      padding: 8px 18px;
      border-radius: 20px;

      font-size: 12px;
    }

    .telegram:hover {
      background: rgba(212,175,55,0.08);
    }
  </style>
</head>

<body>

  <main class="container">

    <!-- BRAND -->

    <header class="brand">

      <div class="brand-name">
        نیک‌فرجام
      </div>

      <div class="brand-en">
        ARZ PLUS
      </div>

      <div class="brand-line"></div>

      <div class="subtitle">
        نرخ لحظه‌ای ارز
      </div>

    </header>


    <!-- RATES -->

    <section class="rates">

      <div class="rate-card">
        <div class="currency">
          <div class="currency-name">
            دلار آمریکا
          </div>

          <div class="currency-symbol">
            USD $
          </div>
        </div>

        <div class="price" id="usd">
          در حال دریافت...
        </div>

        <span class="unit">
          تومان
        </span>
      </div>


      <div class="rate-card">
        <div class="currency">
          <div class="currency-name">
            یورو
          </div>

          <div class="currency-symbol">
            EUR €
          </div>
        </div>

        <div class="price" id="eur">
          در حال دریافت...
        </div>

        <span class="unit">
          تومان
        </span>
      </div>


      <div class="rate-card">
        <div class="currency">
          <div class="currency-name">
            لیر ترکیه
          </div>

          <div class="currency-symbol">
            TRY ₺
          </div>
        </div>

        <div class="price" id="try">
          در حال دریافت...
        </div>

        <span class="unit">
          تومان
        </span>
      </div>

    </section>


    <div class="update" id="update">
      در حال بروزرسانی...
    </div>

    <div class="error" id="error">
      خطا در دریافت نرخ ارز
    </div>


    <!-- FOOTER -->

    <footer class="footer">

      <div class="footer-title">
        ارز پلاس
      </div>

      <div class="footer-text">
        نرخ‌ها به صورت آنلاین بروزرسانی می‌شوند
      </div>

      <a
        class="telegram"
        href="https://t.me/ArzPlusMarket"
        target="_blank"
      >
        کانال تلگرام ارز پلاس
      </a>

    </footer>

  </main>


<script>

  /*
   =====================================================
   فق
   =====================================================
  */

  const API_KEY = "fx-ntz-v1-9vufjr6jM5N618UJuiqNusmZomasLlIOXPryxkBX";


  /*
   =====================================================
   تنظیمات API
   =====================================================
  */

  const API_URL = "https://netarz.ir/api/fx/v1";


  /*
   =====================================================
   نمایش عدد
   =====================================================
  */

  function formatPrice(value) {

    if (value === null || value === undefined || value === "") {
      return "—";
    }

    const number = Number(
      String(value)
        .replace(/,/g, "")
        .replace(/[^\d.-]/g, "")
    );

    if (isNaN(number)) {
      return value;
    }

    return number.toLocaleString("fa-IR");
  }


  /*
   =====================================================
   دریافت نرخ‌ها
   =====================================================
  */

  async function loadRates() {

    const errorBox = document.getElementById("error");

    errorBox.style.display = "none";

    try {

      const response = await fetch(API_URL, {

        method: "GET",

        headers: {
          "Authorization": "Bearer " + API_KEY,
          "Content-Type": "application/json"
        }

      });


      if (!response.ok) {
        throw new Error("API Error: " + response.status);
      }


      const data = await response.json();

      console.log("API DATA:", data);


      /*
       -------------------------------------------------
       اگر ساختار پاسخ API فرق داشت، این قسمت را
       بر اساس پاسخ واقعی API تنظیم می‌کنیم.
       -------------------------------------------------
      */

      const rates = data.data || data.rates || data;


      let usd =
        rates.USD ||
        rates.usd ||
        rates["USD"];


      let eur =
        rates.EUR ||
        rates.eur ||
        rates["EUR"];


      let tr =
        rates.TRY ||
        rates.try ||
        rates["TRY"];


      document.getElementById("usd").textContent =
        formatPrice(usd);

      document.getElementById("eur").textContent =
        formatPrice(eur);

      document.getElementById("try").textContent =
        formatPrice(tr);


      const now = new Date();

      document.getElementById("update").textContent =
        "آخرین بروزرسانی: " +
        now.toLocaleTimeString("fa-IR", {
          hour: "2-digit",
          minute: "2-digit"
        });


    } catch (error) {

      console.error(error);

      document.getElementById("error").style.display =
        "block";

      document.getElementById("update").textContent =
        "اتصال به سامانه نرخ ارز برقرار نشد";

    }

  }


  /*
   =====================================================
   اجرای اولیه
   =====================================================
  */

  loadRates();


  /*
   =====================================================
   بروزرسانی هر 60 ثانیه
   =====================================================
  */

  setInterval(loadRates, 60000);

</script>

</body>
</html>
